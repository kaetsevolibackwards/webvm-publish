
name: Deploy WebVM

on:
  workflow_dispatch:
    inputs:
      DOCKERFILE_PATH:
        description: "Path to Dockerfile"
        required: true
        default: "dockerfiles/debian_mini"

      IMAGE_SIZE:
        description: "Image size"
        required: true
        default: "750M"

      DEPLOY_TO_GITHUB_PAGES:
        description: "Deploy to GitHub Pages"
        required: true
        default: true

      GITHUB_RELEASE:
        description: "Upload GitHub release"
        required: true
        default: false


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TAG: webvm-image
      IMAGE_SIZE: ${{ github.event.inputs.IMAGE_SIZE }}
      DEPLOY_DIR: ${{ github.workspace }}/webvm_deploy

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup build variables
        run: |
          echo "IMAGE_NAME=webvm_$(date +%Y%m%d)_${{ github.run_id }}.ext2" >> $GITHUB_ENV
          mkdir -p $DEPLOY_DIR

      - name: Build Docker image
        run: |
          docker build . \
            --tag $TAG \
            --file ${{ github.event.inputs.DOCKERFILE_PATH }} \
            --platform=i386

      - name: Run container
        run: |
          docker run -d $TAG
          echo "CONTAINER_ID=$(docker ps -aq)" >> $GITHUB_ENV

      - name: Extract container config
        run: |
          echo "CMD=$(docker inspect $CONTAINER_ID | jq -c '.[0].Config.Cmd')" >> $GITHUB_ENV
          echo "ENV=$(docker inspect $CONTAINER_ID | jq -c '.[0].Config.Env')" >> $GITHUB_ENV
          echo "CWD=$(docker inspect $CONTAINER_ID | jq -c '.[0].Config.WorkingDir')" >> $GITHUB_ENV

      - name: Create ext2 image
        run: |
          fallocate -l $IMAGE_SIZE $IMAGE_NAME
          mkfs.ext2 -F $IMAGE_NAME
          mkdir -p /mnt/webvm
          sudo mount -o loop $IMAGE_NAME /mnt/webvm

      - name: Copy filesystem
        run: |
          sudo docker cp -a $CONTAINER_ID:/ /mnt/webvm/
          sudo umount /mnt/webvm

      - name: Split image for hosting
        run: |
          split $IMAGE_NAME $DEPLOY_DIR/$IMAGE_NAME. -b 128k -d

      - name: Write metadata (FIXED)
        run: |
          SIZE=$(stat -c%s $IMAGE_NAME)
          echo $SIZE > $DEPLOY_DIR/$IMAGE_NAME.meta

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Move build output
        run: |
          mv build/* $DEPLOY_DIR/

      - name: Generate index lists
        run: |
          find $DEPLOY_DIR -type d | while read dir; do
            ls "$dir" > "$dir/index.list"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

  deploy:
    needs: build
    if: ${{ github.event.inputs.DEPLOY_TO_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
